# Cloudflare Worker config for the Service Blueprint Demo.
# Replace the account_id placeholder below before running `npm run deploy`.

name = "service-blueprint-demo"
main = "./worker/index.ts"
compatibility_date = "2026-09-01"

# PLACEHOLDER: your Cloudflare account ID (Dashboard > Workers & Pages > Account ID).
account_id = "REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID"

# The hostname the demo is served on (custom domain on the benvollmer.net zone).
routes = [
  { pattern = "fsa.benvollmer.net", custom_domain = true }
]

workers_dev = false
preview_urls = false

[assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
# The Worker runs first so it can verify the Cloudflare Access token on every request,
# including static assets, before anything is served.
run_worker_first = true

[vars]
# `npm run deploy` fills both at deploy time from the Access application it provisions.
# Left empty here so local dev (`npm run dev`) skips the Worker's own token check.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
